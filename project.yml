name: XM6Control
options:
  bundleIdPrefix: com.pdwyx
  deploymentTarget:
    iOS: "13.0"
targets:
  XM6Control:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - sdk: ExternalAccessory.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: XM6
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        MinimumOSVersion: "13.0"
        UISupportedExternalAccessoryProtocols:
          - jp.co.sony.songpal.mdr.link2
          - com.sony.sca.servicelinkage
          - com.sony.mdr.ar.ext1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdwyx.xm6control
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ONLY_ACTIVE_ARCH: NO